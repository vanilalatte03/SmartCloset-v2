spring:
  application:
    name: smartcloset
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    openai:
      api-key: "${OPENAI_API_KEY:}"
      chat:
        options:
          model: ${CLOTHING_ANALYSIS_MODEL:gpt-5.4-nano}
  servlet:
    multipart:
      max-file-size: ${CLOTHING_IMAGE_MAX_SIZE_BYTES:5242880}
      max-request-size: ${CLOTHING_IMAGE_MAX_SIZE_BYTES:5242880}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smartcloset?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:smartcloset}
    password: ${SPRING_DATASOURCE_PASSWORD:smartcloset}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:1}
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui/index.html

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
  endpoint:
    health:
      probes:
        enabled: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
  prometheus:
    metrics:
      export:
        enabled: ${MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        smartcloset.recommendation.duration: true
        smartcloset.weather.provider.duration: true
        smartcloset.clothing.analysis.duration: true

smartcloset:
  seed:
    enabled: ${SMARTCLOSET_SEED_ENABLED:false}
  security:
    jwt:
      secret: "${JWT_SECRET:change-me-local-development-only}"
    refresh-token:
      ttl-days: ${REFRESH_TOKEN_TTL_DAYS:14}
      cookie:
        name: "${REFRESH_TOKEN_COOKIE_NAME:smartcloset.refreshToken}"
        secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
        same-site: "${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}"
        domain: "${REFRESH_TOKEN_COOKIE_DOMAIN:}"
        path: "${REFRESH_TOKEN_COOKIE_PATH:/api/auth}"
        max-age: ${REFRESH_TOKEN_COOKIE_MAX_AGE:14d}
    account-action:
      email-verification-ttl-hours: ${EMAIL_VERIFICATION_TOKEN_TTL_HOURS:24}
      password-reset-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    oauth2:
      frontend-callback-url: "${FRONTEND_AUTH_CALLBACK_URL:http://localhost:5173/auth/callback}"
      state-cookie:
        name: "${OAUTH_STATE_COOKIE_NAME:smartcloset.oauth2State}"
        secure: ${OAUTH_STATE_COOKIE_SECURE:false}
        same-site: "${OAUTH_STATE_COOKIE_SAME_SITE:Lax}"
        domain: "${OAUTH_STATE_COOKIE_DOMAIN:}"
        path: "${OAUTH_STATE_COOKIE_PATH:/api/auth/oauth2}"
        max-age: ${OAUTH_STATE_COOKIE_MAX_AGE:5m}
      google:
        client-id: "${GOOGLE_OAUTH_CLIENT_ID:}"
        client-secret: "${GOOGLE_OAUTH_CLIENT_SECRET:}"
        redirect-uri: "${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/callback/google}"
        authorization-uri: "${GOOGLE_OAUTH_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}"
        token-uri: "${GOOGLE_OAUTH_TOKEN_URI:https://oauth2.googleapis.com/token}"
        user-info-uri: "${GOOGLE_OAUTH_USER_INFO_URI:https://openidconnect.googleapis.com/v1/userinfo}"
        connect-timeout: ${GOOGLE_OAUTH_CONNECT_TIMEOUT:3s}
        read-timeout: ${GOOGLE_OAUTH_READ_TIMEOUT:5s}
  clothing:
    image:
      storage-dir: ${CLOTHING_IMAGE_STORAGE_DIR:./uploads/clothing-images}
      max-size-bytes: ${CLOTHING_IMAGE_MAX_SIZE_BYTES:5242880}
    analysis:
      enabled: ${CLOTHING_ANALYSIS_ENABLED:false}
      low-confidence-threshold: ${CLOTHING_ANALYSIS_LOW_CONFIDENCE_THRESHOLD:0.75}
      daily-limit: ${CLOTHING_ANALYSIS_DAILY_LIMIT:20}
      timeout-seconds: ${CLOTHING_ANALYSIS_TIMEOUT_SECONDS:10}
  weather:
    fallback-enabled: ${WEATHER_FALLBACK_ENABLED:true}
    kma:
      service-key: "${KMA_SERVICE_KEY:}"
      nx: ${KMA_NX:60}
      ny: ${KMA_NY:127}
      base-url: "${KMA_BASE_URL:http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}"
      cache-ttl: ${KMA_CACHE_TTL:2m}
      cache-max-size: ${KMA_CACHE_MAX_SIZE:256}
