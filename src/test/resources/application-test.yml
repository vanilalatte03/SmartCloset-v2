spring:
  servlet:
    multipart:
      max-file-size: ${CLOTHING_IMAGE_MAX_SIZE_BYTES:5242880}
      max-request-size: ${CLOTHING_IMAGE_MAX_SIZE_BYTES:5242880}
  datasource:
    url: jdbc:h2:mem:smartcloset;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

smartcloset:
  clothing:
    image:
      storage-dir: ${java.io.tmpdir}/smartcloset-test-clothing-images
      max-size-bytes: ${CLOTHING_IMAGE_MAX_SIZE_BYTES:5242880}
