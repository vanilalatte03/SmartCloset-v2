name: Issue Triage

on:
  issues:
    types:
      - opened
      - edited
      - reopened

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage-${{ github.repository }}
  cancel-in-progress: false

jobs:
  production-readiness:
    if: contains(github.event.issue.body, '### Priority') && contains(github.event.issue.body, '### Areas') && contains(github.event.issue.body, '### Type')
    runs-on: ubuntu-latest

    steps:
      - name: Apply production readiness labels and milestone
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const labelDefinitions = {
              "priority:P0": { color: "B60205", description: "Must fix before production launch" },
              "priority:P1": { color: "D93F0B", description: "Important production quality work" },
              "priority:P2": { color: "FBCA04", description: "Production polish or follow-up hardening" },
              "area:resilience": { color: "5319E7", description: "External provider timeout retry circuit breaker work" },
              "area:ci": { color: "1D76DB", description: "CI quality gates and automation" },
              "area:observability": { color: "0E8A16", description: "Metrics health dashboards alerting tracing and logs" },
              "area:security": { color: "C5308F", description: "Security-sensitive production readiness work" },
              "area:db": { color: "0052CC", description: "Database schema migration backup and persistence work" },
              "area:deploy": { color: "5319E7", description: "Production runtime deployment and release artifacts" },
              "area:docker": { color: "0E8A16", description: "Docker image and container runtime hardening" },
              "area:rate-limit": { color: "D4C5F9", description: "Quota throttle and abuse protection work" },
              "area:dependencies": { color: "0366D6", description: "Dependency version and support policy work" },
              "type:ops": { color: "C2E0C6", description: "Operational readiness implementation task" },
              "type:spike": { color: "FEF2C0", description: "Investigation or decision task before implementation" },
              "type:epic": { color: "5319E7", description: "Tracking issue that coordinates related issues" }
            };

            const priorities = ["priority:P0", "priority:P1", "priority:P2"];
            const areas = [
              "area:resilience",
              "area:ci",
              "area:observability",
              "area:security",
              "area:db",
              "area:deploy",
              "area:docker",
              "area:rate-limit",
              "area:dependencies"
            ];
            const types = ["type:ops", "type:spike", "type:epic"];
            const controlledLabels = [...priorities, ...areas, ...types];

            // These parser headings must match .github/ISSUE_TEMPLATE/production-readiness.yml labels.
            function parseSections(markdown) {
              const sections = new Map();
              const matches = [...markdown.matchAll(/^### (.+?)\s*$/gm)];
              for (let index = 0; index < matches.length; index += 1) {
                const heading = matches[index][1].trim();
                const start = matches[index].index + matches[index][0].length;
                const end = index + 1 < matches.length ? matches[index + 1].index : markdown.length;
                sections.set(heading, markdown.slice(start, end).trim());
              }
              return sections;
            }

            const sections = parseSections(body);

            function section(label) {
              return sections.get(label) || "";
            }

            function issueNumbers(value) {
              if (!value || /^none$/i.test(value.trim())) {
                return [];
              }
              return [...value.matchAll(/#(\d+)/g)].map((match) => Number(match[1]));
            }

            const priority = (section("Priority").match(/priority:P[0-2]/) || [])[0];
            const selectedAreas = [...section("Areas").matchAll(/area:[a-z-]+/g)]
              .map((match) => match[0])
              .filter((area) => areas.includes(area));
            const selectedType = (section("Type").match(/type:(ops|spike|epic)/) || [])[0];
            const trackedByIssueNumbers = issueNumbers(section("Tracked by"));
            const dependsOnIssueNumbers = issueNumbers(section("Depends on"));

            const desiredLabels = [...new Set([priority, ...selectedAreas, selectedType].filter(Boolean))];
            if (desiredLabels.length === 0) {
              core.info("No production readiness labels found in issue form body.");
              return;
            }

            for (const name of desiredLabels) {
              const definition = labelDefinitions[name];
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color: definition.color,
                  description: definition.description
                });
              } catch (error) {
                if (error.status === 422) {
                  await github.rest.issues.updateLabel({
                    owner,
                    repo,
                    name,
                    new_name: name,
                    color: definition.color,
                    description: definition.description
                  });
                } else {
                  throw error;
                }
              }
            }

            const currentLabels = issue.labels.map((label) => label.name);
            const labelsToRemove = controlledLabels.filter((label) => currentLabels.includes(label) && !desiredLabels.includes(label));
            const labelsToAdd = desiredLabels.filter((label) => !currentLabels.includes(label));

            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issue.number,
                  name: label
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: labelsToAdd
              });
            }

            const milestoneTitle = "Production Readiness";
            const milestones = await github.paginate(github.rest.issues.listMilestones, {
              owner,
              repo,
              state: "open"
            });
            let milestone = milestones.find((item) => item.title === milestoneTitle);
            if (!milestone) {
              const response = await github.rest.issues.createMilestone({
                owner,
                repo,
                title: milestoneTitle,
                description: "운영 시작 전 필요한 안정성, 보안, 배포, 관측성 준비 작업 묶음"
              });
              milestone = response.data;
            }

            if (!issue.milestone || issue.milestone.number !== milestone.number) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                milestone: milestone.number
              });
            }

            function dependenciesSection(trackedByNumbers, dependsOnNumbers) {
              const lines = [];
              for (const number of trackedByNumbers) {
                lines.push(`- Tracked by #${number}.`);
              }
              for (const number of dependsOnNumbers) {
                lines.push(`- Depends on #${number}.`);
              }
              return lines.join("\n");
            }

            function upsertDependenciesSection(markdown, content) {
              if (!content) {
                return markdown;
              }
              const sectionBody = `## Dependencies\n${content}`;
              const pattern = /^## Dependencies\n[\s\S]*?(?=\n## |\s*$)/m;
              if (pattern.test(markdown)) {
                return markdown.replace(pattern, sectionBody);
              }
              return `${markdown.trimEnd()}\n\n${sectionBody}`;
            }

            const normalizedBody = upsertDependenciesSection(
              body,
              dependenciesSection(trackedByIssueNumbers, dependsOnIssueNumbers)
            );
            if (normalizedBody !== body) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                body: normalizedBody
              });
            }

            function trackerSectionTitle(priorityLabel) {
              if (priorityLabel === "priority:P0") {
                return "P0 순서";
              }
              if (priorityLabel === "priority:P1") {
                return "P1 병렬/후속 작업";
              }
              return "P2 후속 작업";
            }

            function updateTrackerBody(markdown, title, trackedIssue) {
              const escapedNumber = String(trackedIssue.number);
              const linePattern = new RegExp(`^- \\[([ xX])\\] #${escapedNumber}\\b.*$`, "m");
              const existingLine = markdown.match(linePattern);
              const checkboxState = existingLine ? existingLine[1] : " ";
              const trackerLine = `- [${checkboxState}] #${trackedIssue.number} ${trackedIssue.title.replace(/\s+/g, " ").trim()}`;
              let nextBody = markdown.replace(new RegExp(`^- \\[[ xX]\\] #${escapedNumber}\\b.*\\n?`, "gm"), "");

              const sectionPattern = new RegExp(`(^## ${title}\\n)([\\s\\S]*?)(?=\\n## |$)`, "m");
              const sectionMatch = nextBody.match(sectionPattern);
              if (sectionMatch) {
                const replacement = `${sectionMatch[1]}${sectionMatch[2].trimEnd()}\n${trackerLine}\n`;
                return nextBody.replace(sectionPattern, replacement);
              }
              return `${nextBody.trimEnd()}\n\n## ${title}\n${trackerLine}\n`;
            }

            for (const trackerIssueNumber of trackedByIssueNumbers) {
              if (trackerIssueNumber === issue.number) {
                continue;
              }
              const response = await github.rest.issues.get({
                owner,
                repo,
                issue_number: trackerIssueNumber
              });
              const trackerIssue = response.data;
              const trackerBody = trackerIssue.body || "";
              const nextTrackerBody = updateTrackerBody(trackerBody, trackerSectionTitle(priority), issue);
              if (nextTrackerBody !== trackerBody) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: trackerIssueNumber,
                  body: nextTrackerBody
                });
              }
            }
