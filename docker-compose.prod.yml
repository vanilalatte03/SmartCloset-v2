name: smartcloset-prod

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  clothing-image-volume-permissions:
    image: busybox:1.36
    user: "0:0"
    command: sh -c "mkdir -p /data/smartcloset/clothing-images && chown -R 10001:10001 /data/smartcloset/clothing-images"
    volumes:
      - clothing-image-data:/data/smartcloset/clothing-images

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SMARTCLOSET_APP_IMAGE:-smartcloset-app:prod}
    depends_on:
      mysql:
        condition: service_healthy
      clothing-image-volume-permissions:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
      SPRING_PROFILES_ACTIVE: prod
      SMARTCLOSET_SEED_ENABLED: ${SMARTCLOSET_SEED_ENABLED:-false}
      RECOMMENDATION_CREATION_THROTTLE_ENABLED: ${RECOMMENDATION_CREATION_THROTTLE_ENABLED:-true}
      RECOMMENDATION_CREATION_THROTTLE_MAX_REQUESTS: ${RECOMMENDATION_CREATION_THROTTLE_MAX_REQUESTS:-30}
      RECOMMENDATION_CREATION_THROTTLE_WINDOW: ${RECOMMENDATION_CREATION_THROTTLE_WINDOW:-1m}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,prometheus}
      MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: ${MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:-true}
      SMARTCLOSET_HEALTHCHECK_URL: ${SMARTCLOSET_HEALTHCHECK_URL:-http://127.0.0.1:8080/actuator/health}
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-false}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REFRESH_TOKEN_COOKIE_NAME: ${REFRESH_TOKEN_COOKIE_NAME:-smartcloset.refreshToken}
      REFRESH_TOKEN_COOKIE_SECURE: ${REFRESH_TOKEN_COOKIE_SECURE:-true}
      REFRESH_TOKEN_COOKIE_SAME_SITE: ${REFRESH_TOKEN_COOKIE_SAME_SITE:-None}
      REFRESH_TOKEN_COOKIE_DOMAIN: ${REFRESH_TOKEN_COOKIE_DOMAIN:-}
      REFRESH_TOKEN_COOKIE_PATH: ${REFRESH_TOKEN_COOKIE_PATH:-/api/auth}
      REFRESH_TOKEN_COOKIE_MAX_AGE: ${REFRESH_TOKEN_COOKIE_MAX_AGE:-14d}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY:-}
      KMA_NX: ${KMA_NX:-60}
      KMA_NY: ${KMA_NY:-127}
      KMA_BASE_URL: ${KMA_BASE_URL:-http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}
      KMA_CACHE_TTL: ${KMA_CACHE_TTL:-2m}
      KMA_CACHE_MAX_SIZE: ${KMA_CACHE_MAX_SIZE:-256}
      WEATHER_FALLBACK_ENABLED: ${WEATHER_FALLBACK_ENABLED:-true}
      CLOTHING_IMAGE_STORAGE_DIR: ${CLOTHING_IMAGE_STORAGE_DIR:-/data/smartcloset/clothing-images}
      CLOTHING_IMAGE_MAX_SIZE_BYTES: ${CLOTHING_IMAGE_MAX_SIZE_BYTES:-5242880}
      CLOTHING_ANALYSIS_ENABLED: ${CLOTHING_ANALYSIS_ENABLED:-false}
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLOTHING_ANALYSIS_MODEL: ${CLOTHING_ANALYSIS_MODEL:-gpt-5.4-nano}
      CLOTHING_ANALYSIS_LOW_CONFIDENCE_THRESHOLD: ${CLOTHING_ANALYSIS_LOW_CONFIDENCE_THRESHOLD:-0.75}
      CLOTHING_ANALYSIS_DAILY_LIMIT: ${CLOTHING_ANALYSIS_DAILY_LIMIT:-20}
      CLOTHING_ANALYSIS_TIMEOUT_SECONDS: ${CLOTHING_ANALYSIS_TIMEOUT_SECONDS:-10}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_OAUTH_CONNECT_TIMEOUT: ${GOOGLE_OAUTH_CONNECT_TIMEOUT:-3s}
      GOOGLE_OAUTH_READ_TIMEOUT: ${GOOGLE_OAUTH_READ_TIMEOUT:-5s}
      FRONTEND_AUTH_CALLBACK_URL: ${FRONTEND_AUTH_CALLBACK_URL:?FRONTEND_AUTH_CALLBACK_URL is required}
      OAUTH_STATE_COOKIE_NAME: ${OAUTH_STATE_COOKIE_NAME:-smartcloset.oauth2State}
      OAUTH_STATE_COOKIE_SECURE: ${OAUTH_STATE_COOKIE_SECURE:-true}
      OAUTH_STATE_COOKIE_SAME_SITE: ${OAUTH_STATE_COOKIE_SAME_SITE:-None}
      OAUTH_STATE_COOKIE_DOMAIN: ${OAUTH_STATE_COOKIE_DOMAIN:-}
      OAUTH_STATE_COOKIE_PATH: ${OAUTH_STATE_COOKIE_PATH:-/api/auth/oauth2}
      OAUTH_STATE_COOKIE_MAX_AGE: ${OAUTH_STATE_COOKIE_MAX_AGE:-5m}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - clothing-image-data:/data/smartcloset/clothing-images

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
    image: ${SMARTCLOSET_FRONTEND_IMAGE:-smartcloset-frontend:prod}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:8080"

volumes:
  clothing-image-data:
    name: ${CLOTHING_IMAGE_DATA_VOLUME_NAME:-smartcloset-prod-clothing-image-data}
  mysql-data:
    name: ${MYSQL_DATA_VOLUME_NAME:-smartcloset-prod-mysql-data}
