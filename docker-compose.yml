services:
  mysql:
    image: mysql:8.4
    container_name: smartcloset-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartcloset}
      MYSQL_USER: ${MYSQL_USER:-smartcloset}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartcloset}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcloset-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/smartcloset?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-smartcloset}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-smartcloset}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-true}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SMARTCLOSET_SEED_ENABLED: ${SMARTCLOSET_SEED_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-change-me-local-development-only}
      REFRESH_TOKEN_COOKIE_NAME: ${REFRESH_TOKEN_COOKIE_NAME:-smartcloset.refreshToken}
      REFRESH_TOKEN_COOKIE_SECURE: ${REFRESH_TOKEN_COOKIE_SECURE:-false}
      REFRESH_TOKEN_COOKIE_SAME_SITE: ${REFRESH_TOKEN_COOKIE_SAME_SITE:-Lax}
      REFRESH_TOKEN_COOKIE_DOMAIN: ${REFRESH_TOKEN_COOKIE_DOMAIN:-}
      REFRESH_TOKEN_COOKIE_PATH: ${REFRESH_TOKEN_COOKIE_PATH:-/api/auth}
      REFRESH_TOKEN_COOKIE_MAX_AGE: ${REFRESH_TOKEN_COOKIE_MAX_AGE:-14d}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY:-}
      KMA_NX: ${KMA_NX:-60}
      KMA_NY: ${KMA_NY:-127}
      KMA_BASE_URL: ${KMA_BASE_URL:-http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}
      KMA_CACHE_TTL: ${KMA_CACHE_TTL:-2m}
      KMA_CACHE_MAX_SIZE: ${KMA_CACHE_MAX_SIZE:-256}
      WEATHER_FALLBACK_ENABLED: ${WEATHER_FALLBACK_ENABLED:-true}
      CLOTHING_IMAGE_STORAGE_DIR: ${CLOTHING_IMAGE_STORAGE_DIR:-/data/smartcloset/clothing-images}
      CLOTHING_IMAGE_MAX_SIZE_BYTES: ${CLOTHING_IMAGE_MAX_SIZE_BYTES:-5242880}
      CLOTHING_ANALYSIS_ENABLED: ${CLOTHING_ANALYSIS_ENABLED:-false}
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLOTHING_ANALYSIS_MODEL: ${CLOTHING_ANALYSIS_MODEL:-gpt-5.4-nano}
      CLOTHING_ANALYSIS_LOW_CONFIDENCE_THRESHOLD: ${CLOTHING_ANALYSIS_LOW_CONFIDENCE_THRESHOLD:-0.75}
      CLOTHING_ANALYSIS_DAILY_LIMIT: ${CLOTHING_ANALYSIS_DAILY_LIMIT:-20}
      CLOTHING_ANALYSIS_TIMEOUT_SECONDS: ${CLOTHING_ANALYSIS_TIMEOUT_SECONDS:-10}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8080/api/auth/oauth2/callback/google}
      GOOGLE_OAUTH_CONNECT_TIMEOUT: ${GOOGLE_OAUTH_CONNECT_TIMEOUT:-3s}
      GOOGLE_OAUTH_READ_TIMEOUT: ${GOOGLE_OAUTH_READ_TIMEOUT:-5s}
      FRONTEND_AUTH_CALLBACK_URL: ${FRONTEND_AUTH_CALLBACK_URL:-http://localhost:5173/auth/callback}
      OAUTH_STATE_COOKIE_NAME: ${OAUTH_STATE_COOKIE_NAME:-smartcloset.oauth2State}
      OAUTH_STATE_COOKIE_SECURE: ${OAUTH_STATE_COOKIE_SECURE:-false}
      OAUTH_STATE_COOKIE_SAME_SITE: ${OAUTH_STATE_COOKIE_SAME_SITE:-Lax}
      OAUTH_STATE_COOKIE_DOMAIN: ${OAUTH_STATE_COOKIE_DOMAIN:-}
      OAUTH_STATE_COOKIE_PATH: ${OAUTH_STATE_COOKIE_PATH:-/api/auth/oauth2}
      OAUTH_STATE_COOKIE_MAX_AGE: ${OAUTH_STATE_COOKIE_MAX_AGE:-5m}
      TZ: Asia/Seoul
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - clothing-image-data:/data/smartcloset/clothing-images

  frontend:
    image: node:22-alpine
    container_name: smartcloset-frontend
    working_dir: /app
    depends_on:
      app:
        condition: service_started
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm ci && npm run dev"

volumes:
  clothing-image-data:
  frontend-node-modules:
  mysql-data:
